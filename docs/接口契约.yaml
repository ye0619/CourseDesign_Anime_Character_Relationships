        "503":
          $ref: "#/components/responses/Error"
      description: " 名称检索包括当前版本的已审核外站别名；同名结果按稳定实体编号分别分页。"
  /anime/{uid}:
    get:
      summary: 作品详情；未知或停用实体404
      operationId: get_anime_uid_
      x-stage: S07
      x-implemented: true
      security: []
      parameters:
        - name: uid
          in: path
