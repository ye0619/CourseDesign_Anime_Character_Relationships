components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 服务端Session；管理接口需要ADMIN。CSRF令牌通过/auth/csrf获取，变更请求使用响应headerName指定的头。
  responses:
    Error:
      description: 业务、参数或依赖错误；HTTP状态表达失败，requestId用于诊断
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        requestId:
          anyOf:
            - type: string
            - type: "null"
      required:
        - code
        - message
        - data
        - requestId
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
      required:
        - status
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
            - READY
            - NOT_READY
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum:
              - UP
              - DOWN
        checkedAt:
          type: string
          format: date-time
      required:
        - status
        - dependencies
        - checkedAt
    Entity:
      type: object
      properties:
        uid:
          type: string
        type:
          type: string
          enum:
            - ANIME
            - PERSON
            - CHARACTER
        source:
          type: string
        sourceId:
          type: string
        name:
          type: string
        nameCn:
          anyOf:
            - type: string
            - type: "null"
        aliases:
          type: array
          items:
            type: string
        summary:
          anyOf:
            - type: string
            - type: "null"
        imageUrl:
          anyOf:
            - type: string
            - type: "null"
        active:
          type: boolean
        airDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        year:
          anyOf:
            - type: integer
            - type: "null"
        format:
          anyOf:
            - type: string
            - type: "null"
        updatedAt:
          type: string
          format: date-time
        onlineAvailable: &a29
          type: boolean
        localAvailable: *a29
        localChecked: *a29
        localUid: *a2
        score:
          type: number
        rank: &a30
          type: integer
        episodes: *a30
        subjectUrl:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
        ratingCount:
          type: integer
        nameAssertions:
          type: array
          items:
            $ref: "#/components/schemas/NameAssertion"
        nameNotice:
          type: string
          description: 审核别名读取失败时保留原来源资料，并明确提示不完整
        libraryStatus:
          type: string
          enum:
            - ARCHIVED
            - ONLINE_ONLY
            - UNCHECKED
      required:
        - uid
        - type
        - source
        - sourceId
        - name
        - active
    Staff:
      type: object
      properties:
        entity:
          $ref: "#/components/schemas/Entity"
