                required:
                  - code
                  - message
                  - data
                  - requestId
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          description: 至少一个数据库不可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: DEPENDENCIES_UNAVAILABLE
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Readiness"
                  requestId:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - requestId
  /auth/csrf:
    get:
      summary: 获取CSRF令牌；登录前后需刷新
      operationId: get_auth_csrf
      x-stage: S06
      x-implemented: true
