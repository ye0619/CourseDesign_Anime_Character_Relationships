                  - message
                  - data
                  - requestId
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      summary: 登录，Session防固定；请求必须带CSRF头
      operationId: post_auth_login
      x-stage: S06
      x-implemented: true
      security: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
                  requestId:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - requestId
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - username
                - password
      deprecated: true
      description: 旧本地账号维护接口。默认关闭；仅在LEGACY_ADMIN_ENABLED=true维护模式下使用。普通产品不依赖本地登录。
  /auth/logout:
    post:
      summary: 退出并清理Session；需CSRF
      operationId: post_auth_logout
      x-stage: S06
      x-implemented: true
      security: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    anyOf:
                      - {}
                      - type: "null"
                  requestId:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - requestId
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      deprecated: true
      description: 旧本地账号维护接口。默认关闭；仅在LEGACY_ADMIN_ENABLED=true维护模式下使用。普通产品不依赖本地登录。
