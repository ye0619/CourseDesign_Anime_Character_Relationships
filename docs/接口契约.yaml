openapi: 3.1.0
info:
  title: 映间 AnimeGraph API
  version: 0.21.0
  description: 动画角色关系探索与Bangumi观看画像。统一作品页面，本地优先、缺失补全；普通用户无需注册。保存仅本机并要求CSRF。历史精选产品已移除。 本地图谱独立持久化、备份恢复和画像v4扩展。
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      summary: 进程存活
      operationId: get_health_live
      x-stage: S02
      x-implemented: true
      security: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Health"
                  requestId:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - requestId
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      summary: 两数据库均可查询才返回200，否则503并保留Readiness数据
      operationId: get_health_ready
      x-stage: S02
      x-implemented: true
      security: []
      parameters: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    const: OK
                  message:
                    type: string
                  data:
